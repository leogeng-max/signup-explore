<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign-up First Screen Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: review shell (concept list · phone stage · rationale) around a fixed-black II phone.
   Phone interior follows the II design system: greyscale, hairlines, Inter, no $ sign. */
:root{
  --bg:#ECEDED; --panel:#F7F8F8; --fg:#121314; --muted:#5D6265; --line:#D5D8D9; --chip:#E2E4E5;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --ease:cubic-bezier(.32,.72,0,1);
  /* II phone tokens (single dark look, by design) */
  --k:#000; --div:#1C1C1C; --surf:#232627; --t1:#FFFFFF; --t2:#C7C7C7; --t3:#929292; --t4:#565B5E;
  --pos:#5A8F6B; --neg:#A86B6B;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0D0E; --panel:#131516; --fg:#E8E9EA; --muted:#8C9194; --line:#24272A; --chip:#1D2022; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C0D0E; --panel:#131516; --fg:#E8E9EA; --muted:#8C9194; --line:#24272A; --chip:#1D2022; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);margin:0;-webkit-font-smoothing:antialiased}
.app{height:100%;display:grid;grid-template-columns:260px 1fr 300px;gap:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.side{display:flex;flex-direction:column;gap:14px;min-height:0;padding-right:16px}
.side h1{font-size:18px;font-weight:600;letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}
.side p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
.list{display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0;margin:0 -6px}
.item{all:unset;cursor:pointer;display:grid;grid-template-columns:26px 1fr;gap:6px;padding:9px 6px;border-radius:6px;align-items:baseline}
.item:hover{background:var(--chip)}
.item:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.item .n{font:500 11px var(--mono);color:var(--muted)}
.item .nm{font-size:13.5px;font-weight:500;letter-spacing:-.01em}
.item .tg{grid-column:2;font-size:11.5px;color:var(--muted);line-height:1.35}
.grp{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 6px 6px;border-top:1px solid var(--line);margin-top:8px}
.item[aria-current="true"]{background:var(--fg);color:var(--bg)}
.item[aria-current="true"] .n,.item[aria-current="true"] .tg{color:var(--bg);opacity:.7}

.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.ctrl{display:flex;gap:8px;align-items:center}
.ctrl button{all:unset;cursor:pointer;font:500 12.5px var(--sans);padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.ctrl button:hover{border-color:var(--muted)}
.ctrl button:focus-visible{outline:2px solid var(--fg)}
.ctrl .count{font:500 12px var(--mono);color:var(--muted);min-width:52px;text-align:center}
.devwrap{position:relative}
.device{position:absolute;left:0;top:0;width:391px;height:828px;transform-origin:0 0;border-radius:56px;background:#0A0A0A;
  box-shadow:0 0 0 1px #2a2a2a, 0 30px 60px -20px rgba(0,0,0,.45)}
.screen{position:absolute;left:8px;top:8px;width:375px;height:812px;border-radius:48px;overflow:hidden;background:var(--k);isolation:isolate}
.island{position:absolute;left:50%;top:11px;width:120px;height:34px;margin-left:-60px;background:#000;border-radius:20px;z-index:50}

.notes{min-height:0;overflow:auto;padding-left:16px;display:flex;flex-direction:column;gap:18px}
.notes .eyebrow{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.notes h2{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:4px 0 6px;text-wrap:balance}
.notes p{margin:0;font-size:13px;line-height:1.55;color:var(--fg)}
.notes ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.notes li{font-size:12.5px;line-height:1.45;padding-left:12px;border-left:2px solid var(--line)}
.notes li b{font:500 11px var(--mono);color:var(--muted);display:block;margin-bottom:2px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks span{font-size:11.5px;padding:4px 8px;border-radius:999px;background:var(--chip);color:var(--fg)}
.disclaim{font-size:11.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:12px}

@media (max-width:1100px){
  .app{grid-template-columns:1fr;height:auto;gap:16px}
  .side{padding-right:0}
  .list{flex-direction:row;overflow-x:auto;margin:0;padding-bottom:4px}
  .item{grid-template-columns:auto;flex:0 0 auto;padding:8px 12px;border:1px solid var(--line)}
  .item .tg{display:none}
  .item .n{display:none}
  .notes{padding-left:0;overflow:visible}
  .grp{border-top:0;margin:0;padding:8px 6px;white-space:nowrap;align-self:center}
}

/* ============== II phone interior ============== */
.scr{position:absolute;inset:0;background:var(--k);color:var(--t1);display:flex;flex-direction:column;font-family:var(--sans);overflow:hidden;font-feature-settings:"cv11","ss01"}
.sb{height:50px;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 40px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sb svg{display:block}
.nav{height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.mark{font-size:20px;font-weight:300;letter-spacing:-.06em;color:var(--t1)}
.skip{all:unset;cursor:pointer;color:var(--t3);font:500 14px var(--sans);padding:8px 0}
.body{flex:1 1 auto;min-height:0;position:relative;padding:0 20px;display:flex;flex-direction:column}
.foot{flex:0 0 auto;padding:10px 20px 26px;display:flex;flex-direction:column;gap:14px}
.btn{all:unset;cursor:pointer;height:52px;display:flex;align-items:center;justify-content:center;background:var(--t1);color:var(--k);font:600 16px var(--sans);letter-spacing:-.01em}
.btn-sub{font-weight:400;font-size:12.5px;opacity:.55;margin-left:10px}
.login{all:unset;cursor:pointer;text-align:center;color:var(--t1);font:500 14px var(--sans);padding:2px 0}
.sd{font-size:11px;color:var(--t3);text-align:center;letter-spacing:.01em}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);font-weight:500}
.h1{font-weight:300;font-size:31px;line-height:1.06;letter-spacing:-.035em;margin:0;text-wrap:balance}
.sub{font-size:15px;line-height:1.42;color:var(--t2);margin:0;text-wrap:pretty}
.tn{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--div)}

/* reveal + draw primitives, driven by [data-d] */
.fi{opacity:0;transform:translateY(8px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
.fi.on{opacity:1;transform:none}
.dl{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.8s var(--ease)}
.dl.on{stroke-dashoffset:0}
.fo{opacity:0;transition:opacity 1s var(--ease)}
.fo.on{opacity:1}

/* AI-style source attribution */
.srcs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.srcs .lbl{margin-right:2px}
.cite{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--div);padding:4px 8px 4px 4px;font-size:10.5px;color:var(--t3);line-height:1}
.cite i{font-style:normal;display:inline-grid;place-items:center;width:15px;height:15px;background:var(--surf);color:var(--t2);font-size:9.5px;font-weight:600}

/* 01 */
.m3{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--div);border-bottom:1px solid var(--div)}
.m3>div{padding:12px 0 12px 12px;border-left:1px solid var(--div);display:flex;flex-direction:column;gap:6px}
.m3>div:first-child{border-left:0;padding-left:0}
.m3 .v{font-size:22px;font-weight:300;letter-spacing:-.03em}
.m3 .v small{font-size:12px;color:var(--t3);margin-left:2px}
.legend{display:flex;gap:16px;font-size:11px;color:var(--t3);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend em{display:inline-block;width:16px;height:0;border-top:1.5px solid var(--t1)}
.legend em.d{border-top:1.5px dashed var(--t3)}
.ailine{font-size:11px;color:var(--t3);display:flex;gap:8px;align-items:center}
.ailine .pulse{width:6px;height:6px;border-radius:50%;background:var(--t2);animation:pl 1.6s infinite}
@keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}

/* 02 */
.half{display:flex;flex-direction:column;gap:8px;padding:12px 0}
.trows{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:52px 1fr 64px 44px;align-items:center;gap:8px;height:30px;font-size:12px;border-bottom:1px solid #141414}
.trow .s{font-weight:600}
.trow .p{color:#bbb;text-align:right}
.trow .c{text-align:center;font-weight:600;font-size:11px;padding:3px 0;border-radius:4px;color:#000}
.trow .c.up{background:#1ED67A}.trow .c.dn{background:#FF4B5C}
.trow .b{font-size:10px;font-weight:700;text-align:center;border:1px solid #333;border-radius:4px;padding:3px 0;color:#ddd}
.flash{animation:fl .35s}
@keyframes fl{from{background:#2a2a2a}to{background:transparent}}
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tchips span{font-size:10px;font-weight:700;padding:3px 7px;border-radius:999px;background:#1d1d1d;color:#ffcf3d}
.tchips span.r{color:#FF4B5C}
.badge{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:8px;background:#FF4B5C;color:#fff;font-size:9.5px;font-weight:700;margin-left:6px;padding:0 4px}
.iirow{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t2)}

/* 03 */
.seg{display:flex;border:1px solid var(--div)}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;font:500 12px var(--sans);color:var(--t3);height:32px;line-height:32px;transition:color .2s,background .2s}
.seg button[aria-pressed="true"]{background:var(--t1);color:var(--k)}
.big{font-size:44px;font-weight:200;letter-spacing:-.045em;line-height:1}
.cap{font-size:14px;color:var(--t2);line-height:1.4;min-height:40px;transition:opacity .5s}

/* 04 */
.quote{font-size:25px;font-weight:300;line-height:1.16;letter-spacing:-.03em;margin:0;text-wrap:balance}
.attr{font-size:12px;color:var(--t3);margin-top:10px}
.orbit text{font-family:var(--sans)}
.node circle{transition:fill .3s, r .3s}
.node text{transition:fill .3s}

/* 05 */
.boot{font-family:var(--mono);font-size:11.5px;line-height:1.5;display:grid;grid-template-columns:104px 1fr 20px;column-gap:8px;row-gap:9px;color:var(--t2)}
.boot .k{color:var(--t3)}
.boot .ok{color:var(--t4);text-align:right}
.boot .ok.on{color:var(--t2)}
.caret{display:inline-block;width:7px;height:13px;background:var(--t1);vertical-align:-2px;animation:pl 1s steps(1) infinite}
.os-h{font-size:30px;font-weight:300;letter-spacing:-.035em;line-height:1.08;margin:0;text-wrap:balance}

/* 06 */
.hz{display:flex;flex-direction:column;gap:12px}
.hzr{display:grid;grid-template-columns:62px 1fr 54px;gap:10px;align-items:center}
.hzr .k{font-size:12px;color:var(--t2)}
.hzr .v{font-size:12px;text-align:right;color:var(--t1)}
.track{height:14px;position:relative}
.bar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--t1);transition:width 1.8s var(--ease)}
.bar.dim{background:var(--t4)}
.ann{grid-column:2/4;font-size:10.5px;color:var(--t3);margin-top:-6px}

/* 07 */
.cvwrap{position:relative;flex:1;min-height:0;margin:0 -20px}
.cvwrap canvas{position:absolute;inset:0;width:100%;height:100%}
/* ===== flow screens (shared after every first page) ===== */
.scr.enter{animation:slin .5s var(--ease)}
.scr.back-enter{animation:slback .5s var(--ease)}
@keyframes slin{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes slback{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
.fhd{height:44px;flex:0 0 auto;display:grid;grid-template-columns:40px 1fr auto;align-items:center;padding:0 20px;gap:8px}
.fhd .back{all:unset;cursor:pointer;font-size:20px;line-height:1;color:var(--t1);padding:6px 0}
.fhd .lbl{text-align:center}
.fhd .illus,.fhd .ph{justify-self:end;min-width:40px;text-align:right}
.fb{flex:1 1 auto;min-height:0;overflow:auto;padding:8px 20px 0;display:flex;flex-direction:column;gap:22px;scrollbar-width:none}
.fb::-webkit-scrollbar{display:none}
.h2f{font-size:28px;font-weight:300;letter-spacing:-.035em;line-height:1.08;margin:0;text-wrap:balance}
.pf{font-size:14px;color:var(--t2);line-height:1.45;margin:6px 0 0;text-wrap:pretty}
.ff{flex:0 0 auto;padding:12px 20px 26px;display:flex;flex-direction:column;gap:10px}
.btn2{all:unset;cursor:pointer;height:52px;display:flex;align-items:center;justify-content:center;border:1px solid var(--t4);color:var(--t1);font:500 15px var(--sans)}
.lnk{all:unset;cursor:pointer;text-align:center;color:var(--t3);font:500 13.5px var(--sans);padding:4px 0}
.pair{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--div);border-bottom:1px solid var(--div)}
.pair>div{padding:14px 0;display:flex;flex-direction:column;gap:6px}
.pair>div+div{border-left:1px solid var(--div);padding-left:14px}
.pair .v{font-size:30px;font-weight:200;letter-spacing:-.04em}
.rows{display:flex;flex-direction:column}
.rw{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--div)}
.rw:first-of-type{border-top:1px solid var(--div)}
.rw .nm{font-size:15px;color:var(--t1)}
.rw .st{font-size:12px;color:var(--t3);margin-top:3px}
.rw .go{font-size:13px;color:var(--t2)}
.rw .go.hot{color:var(--t1)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--t2)}
.dot.w{background:transparent;border:1px solid var(--t2)}
.blk{display:flex;flex-direction:column;gap:6px}
.blk .t{font-size:15px;line-height:1.42;color:var(--t1)}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv2 .v{font-size:22px;font-weight:300;letter-spacing:-.03em}
.sig{display:flex;justify-content:space-between;font-size:13.5px;padding:11px 0;border-bottom:1px solid var(--div);color:var(--t2)}
.sig b{font-weight:500;color:var(--t1)}
.sig b.w{color:var(--t3)}
.fld{display:flex;flex-direction:column;gap:8px}
.fld label{font-size:13px;color:var(--t2);display:flex;justify-content:space-between}
.fld label span{color:var(--t3)}
.inp{all:unset;box-sizing:border-box;width:100%;background:var(--surf);color:var(--t1);font:400 15px/1.4 var(--sans);padding:13px 14px}
textarea.inp{resize:none;display:block}
.inp::placeholder{color:var(--t4)}
.inp:focus{outline:1px solid var(--t3)}
.chips4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chips4 button{all:unset;cursor:pointer;text-align:center;height:42px;line-height:42px;border:1px solid var(--div);font:500 14px var(--sans);color:var(--t2);font-variant-numeric:tabular-nums}
.chips4 button[aria-pressed="true"]{background:var(--t1);color:var(--k);border-color:var(--t1)}
.aitag{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);border:1px solid var(--div);padding:2px 6px}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:end;height:170px;border-bottom:1px solid var(--div)}
.bars>div{display:flex;gap:5px;align-items:flex-end;justify-content:center;height:100%}
.bars i{display:block;width:16px;height:0;transition:height 1.4s var(--ease)}
.bars i.s{border:1px solid var(--t4);border-bottom:0}
.bars i.a{background:var(--t1)}
.bx{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;text-align:center;font-size:12px;color:var(--t2);margin-top:8px}
.opt{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:14px 0 14px 14px;border-left:2px solid var(--div)}
.opt[aria-pressed="true"]{border-left-color:var(--t1)}
.opt .n{font-size:16px;color:var(--t1);display:flex;gap:10px;align-items:baseline}
.opt .n span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.opt .d{font-size:13px;color:var(--t3);line-height:1.4}
.opt[aria-pressed="false"] .n{color:var(--t2)}
.or{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;color:var(--t3);font-size:12px}
.or i{height:1px;background:var(--div)}
.legal{font-size:11px;color:var(--t3);line-height:1.45;text-align:center;margin:0}
.legal u{color:var(--t2)}
.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--div);padding:10px 8px 28px}
.tabs button{all:unset;cursor:pointer;text-align:center;font:500 12px var(--sans);color:var(--t3);position:relative;padding-top:8px}
.tabs button[aria-current="true"]{color:var(--t1)}
.tabs button[aria-current="true"]::before{content:"";position:absolute;top:-11px;left:50%;width:20px;margin-left:-10px;height:2px;border-radius:2px;background:var(--t1)}
.card{border-top:1px solid var(--div);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.notes .flow{display:flex;flex-direction:column;gap:2px}
.notes .flow button{all:unset;cursor:pointer;display:grid;grid-template-columns:22px 1fr;font-size:12.5px;padding:6px 8px;border-radius:6px}
.notes .flow button span{font:500 11px var(--mono);color:var(--muted)}
.notes .flow button:hover{background:var(--chip)}
.notes .flow button[aria-current="true"]{background:var(--fg);color:var(--bg)}
.notes .flow button[aria-current="true"] span{color:var(--bg);opacity:.7}

/* round 2: visual-first */
.hx{font-size:40px;font-weight:200;letter-spacing:-.05em;line-height:1.02;margin:6px 0 0;text-wrap:balance}
.hx .dim{color:var(--t4)}
.cv2{position:relative;flex:1 1 auto;min-height:0}
.cv2 canvas,.cv2 svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tiny{font:400 10px var(--mono);color:var(--t4);letter-spacing:.02em}
.readout{font-size:46px;font-weight:200;letter-spacing:-.05em;line-height:1}
.cvlbl{position:absolute;left:20px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);font-weight:500}
.cvlbl b{display:block;font-size:13px;letter-spacing:-.01em;text-transform:none;color:var(--t2);font-weight:400;margin-top:3px}

/* 08 */
.tog{display:flex;gap:6px}
.tog button{all:unset;cursor:pointer;font:500 11.5px var(--sans);padding:6px 10px;border:1px solid var(--div);color:var(--t3)}
.tog button[aria-pressed="true"]{border-color:var(--t1);color:var(--t1)}
.ledger{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:1fr auto;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--div)}
.lrow .k{font-size:14px;color:var(--t2)}
.lrow .v{font-size:20px;font-weight:300;letter-spacing:-.02em}
.lbar{grid-column:1/3;height:3px;background:var(--div);margin-top:10px;position:relative}
.lbar i{position:absolute;left:0;top:0;bottom:0;background:var(--t1);transition:width 1.5s var(--ease)}
.lbar i.g{background:var(--t3)}
.diff{font-size:64px;font-weight:200;letter-spacing:-.05em;line-height:1}
.diff small{font-size:18px;color:var(--t3);letter-spacing:-.01em;margin-left:4px}

/* 09 */
.rec{border:1px solid var(--div);display:flex;flex-direction:column}
.rec>div{padding:12px 14px;border-top:1px solid var(--div)}
.rec>div:first-child{border-top:0}

.rec .tk{font-size:17px;font-weight:500;letter-spacing:-.01em}
.rec .tk span{color:var(--t3);font-weight:400;font-size:13px;margin-left:6px}
.rec .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.prov{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);border:1px solid var(--div);padding:2px 6px}

/* 10 — inverted paper study */
.scr.paper{--k:#FFFFFF; --div:#E4E4E4; --surf:#F2F2F2; --t1:#000000; --t2:#3B3B3B; --t3:#707070; --t4:#B4B4B4}
.mf{font-size:34px;font-weight:300;letter-spacing:-.04em;line-height:1.08;margin:0}
.mf .st{color:var(--t1);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:transparent;transition:color 1.2s var(--ease),text-decoration-color .9s var(--ease)}

.mf .em{font-weight:500}

@media (prefers-reduced-motion: reduce){
  .fi,.dl,.fo,.bar,.lbar i,.mf .st{transition:none!important}
  .ailine .pulse,.caret{animation:none}
}
</style>

</head>
<body>
<div class="app">
  <aside class="side">
    <div>
      <div style="font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">II · Sign-up · Screen 1</div>
      <h1>Fifteen first screens, one flow</h1>
    </div>
    <p>Pick a first-screen study, then tap <b>Look inside</b> on the phone to walk the full sign-up flow. Every study leads into the same six screens.</p>
    <nav class="list" id="list" aria-label="Studies"></nav>
  </aside>

  <main class="stage" id="stage">
    <div class="devwrap" id="devwrap">
      <div class="device" id="device"><div class="screen" id="screen"></div><div class="island"></div></div>
    </div>
    <div class="ctrl">
      <button id="prev" aria-label="Previous study">← Prev</button>
      <span class="count" id="count">01 / 10</span>
      <button id="next" aria-label="Next study">Next →</button>
      <button id="replay">Replay</button>
    </div>
  </main>

  <aside class="notes" id="notes" aria-live="polite"></aside>
</div>

<script>
(() => {
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MINUS = '−';
const PACE = 1.6; // >1 = slower; scales every reveal delay and scripted step
const fmt = (v, dec = 1, suf = '%', sign = true) => (sign ? (v >= 0 ? '+' : MINUS) : (v < 0 ? MINUS : '')) + Math.abs(v).toFixed(dec) + suf;

/* seeded random walks that land exactly on a target return */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function walk(seed, n, endRet, vol){
  const r = rng(seed); let c = 0; const cum = [0];
  for (let i = 1; i <= n; i++){ c += (r()+r()+r()-1.5)*vol; cum.push(c); }
  const tgt = Math.log(1+endRet), drift = tgt - cum[n];
  return cum.map((v,i) => 100*Math.exp(v + drift*i/n));
}
function pathOf(arr, x0, w, y0, h, min, max){
  return arr.map((v,i) => (i?'L':'M') + (x0 + w*i/(arr.length-1)).toFixed(1) + ',' + (y0 + h*(1-(v-min)/(max-min))).toFixed(1)).join('');
}
const yOf = (v, y0, h, min, max) => y0 + h*(1-(v-min)/(max-min));
const ease = t => 1 - Math.pow(1-t, 3);

/* ---------- shared phone chrome ---------- */
const SB = `<div class="sb"><span>9:41</span><svg width="68" height="12" viewBox="0 0 68 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3.5" width="3" height="8.5" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/><path d="M30 3.2a8.5 8.5 0 0 1 11.6 0l-1.3 1.4a6.6 6.6 0 0 0-9 0zM32.6 6a4.9 4.9 0 0 1 6.4 0l-1.3 1.4a3 3 0 0 0-3.8 0zM35.8 11l-1.7-1.8a2.4 2.4 0 0 1 3.4 0z"/><rect x="45.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="47.5" y="2.5" width="16" height="7" rx="1.5"/><rect x="66.5" y="4" width="1.5" height="4" rx=".7" opacity=".4"/></svg></div>`;
const NAV = `<div class="nav"><span class="mark" aria-label="Intelligent Investing">//</span><button class="skip" data-go="5">Skip</button></div>`;
const FOOT = (d=0) => `<div class="foot fi" data-d="${d}"><button class="btn" data-go="1">Look inside<span class="btn-sub">No account needed</span></button><button class="login" data-go="6">I already have an account</button><div class="sd">Self-directed investing. Investing involves risk, including loss of principal.</div></div>`;
const SOURCES = (d, items) => `<div class="srcs fi" data-d="${d}"><span class="lbl">Sources</span>${items.map((s,i)=>`<span class="cite"><i>${i+1}</i>${s}</span>`).join('')}</div>`;

/* ================= THE TEN STUDIES ================= */
const V = [];

/* 01 — Benchmark, front and centre */
V.push({
  name:'Benchmark, front and centre', tag:'The approved direction: portfolio vs S&P with Portfolio / Alpha / S&P',
  html(){
    return `<div class="body" style="gap:14px">
      <h1 class="h1 fi" data-d="80">The world doesn’t need another trading&nbsp;app.</h1>
      <p class="sub fi" data-d="260">An operating system for investors playing the long game. Every decision, measured against the alternative.</p>
      <div class="fi" data-d="420" style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
        <div class="legend"><span><em></em>Portfolio</span><span><em class="d"></em>S&amp;P 500</span></div>
        <span class="lbl">5Y · Illustrative</span>
      </div>
      <svg id="c1" width="335" height="176" viewBox="0 0 335 176" style="overflow:visible"></svg>
      <div class="m3 fi" data-d="1500">
        <div><span class="lbl">Portfolio</span><span class="v tn" data-count="71.8">+0.0%</span></div>
        <div><span class="lbl">Alpha</span><span class="v tn" data-count="-12.5" data-suf=" pts" style="font-weight:400">+0.0</span></div>
        <div><span class="lbl">S&amp;P 500</span><span class="v tn" data-count="84.3" style="color:var(--t2)">+0.0%</span></div>
      </div>
      <div class="ailine fi" data-d="2300"><span class="pulse"></span>Compared against the S&amp;P 500 total return, recalculated daily</div>
      ${SOURCES(2500,['S&amp;P Dow Jones Indices','Illustrative portfolio, not an account'])}
    </div>${FOOT(2700)}`;
  },
  init(el){
    const svg = el.querySelector('#c1');
    const P = walk(7,60,.718,.045), S = walk(3,60,.843,.032);
    const all = P.concat(S), min = Math.min(...all)-4, max = Math.max(...all)+4;
    const W = 282, H = 150;
    let g = '';
    [0,.5,1].forEach(f => g += `<line x1="0" x2="${W}" y1="${(H*f).toFixed(1)}" y2="${(H*f).toFixed(1)}" stroke="#1C1C1C"/>`);
    const yP = yOf(P[60],0,H,min,max), yS = yOf(S[60],0,H,min,max);
    g += `<path d="${pathOf(S,0,W,0,H,min,max)}" fill="none" stroke="#929292" stroke-width="1.25" stroke-dasharray="3 3" class="fo" data-d="500"/>`;
    g += `<path d="${pathOf(P,0,W,0,H,min,max)}" fill="none" stroke="#fff" stroke-width="1.75" pathLength="1" class="dl" data-d="600"/>`;
    g += `<circle cx="${W}" cy="${yP}" r="3.5" fill="#fff" class="fo" data-d="1900"/><circle cx="${W}" cy="${yS}" r="3" fill="#929292" class="fo" data-d="1900"/>`;
    g += `<g class="fo" data-d="2100"><line x1="${W+12}" x2="${W+12}" y1="${yS}" y2="${yP}" stroke="#fff"/><line x1="${W+8}" x2="${W+16}" y1="${yS}" y2="${yS}" stroke="#fff"/><line x1="${W+8}" x2="${W+16}" y1="${yP}" y2="${yP}" stroke="#fff"/>
      <text x="${W+21}" y="${(yP+yS)/2+4}" fill="#fff" font-size="11" font-family="Inter" class="tn">${MINUS}12.5</text></g>`;
    g += `<text x="0" y="${H+18}" fill="#565B5E" font-size="10" font-family="Inter">Oct 2021</text><text x="${W}" y="${H+18}" fill="#565B5E" font-size="10" text-anchor="end" font-family="Inter">Oct 2026</text>`;
    svg.innerHTML = g;
  },
  notes:{
    idea:'The one direction the team already agreed on, made into the hero. The portfolio line draws in, the S&P 500 sits beside it as a dashed line, and the gap between them gets measured and labelled as alpha. The illustrative alpha is negative on purpose: the screen proves the app will tell you when the index would have done better.',
    checks:['Attribution under chart','Skip','Self-directed line','Illustrative label']
  }
});

/* 02 — Two systems */
V.push({
  name:'Two systems', tag:'Split screen: optimized for activity vs optimized for compounding',
  html(){
    return `<div class="body" style="gap:4px">
      <p class="sub fi" data-d="60" style="color:var(--t1);font-size:20px;font-weight:300;letter-spacing:-.02em">Trading has never been easier.</p>
      <div class="half fi" data-d="250">
        <div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl">Most apps ask</span><span style="font-size:11px;color:#bbb">Alerts<span class="badge">12</span></span></div>
        <div style="font-size:17px;font-weight:300;letter-spacing:-.02em">What should I trade next?</div>
        <div class="tchips"><span>TRENDING</span><span class="r">TOP LOSERS</span><span>MOST TRADED</span></div>
        <div class="trows" id="trows"></div>
        <div style="font-size:11px;color:#bbb">47 trades this month <span style="color:#1ED67A">▲ 12</span></div>
      </div>
      <div class="hr"></div>
      <div class="half fi" data-d="900">
        <span class="lbl" style="color:var(--t2)">II asks</span>
        <div style="font-size:17px;font-weight:400;letter-spacing:-.02em">What’s the best use of my capital?</div>
        <svg id="c2" width="335" height="76" viewBox="0 0 335 92" preserveAspectRatio="none"></svg>
        <div class="iirow tn"><span>3 decisions this quarter, each with a thesis</span><span>vs S&amp;P 500</span></div>
      </div>
      <p class="sub fi" data-d="1500" style="color:var(--t1);font-size:20px;font-weight:300;letter-spacing:-.02em;line-height:1.2;margin-top:6px">Making intelligent capital decisions is something else entirely.</p>
    </div>${FOOT(1800)}`;
  },
  init(el, ctx){
    const rows = [['TSLA',248.31],['NVDA',131.07],['PLTR',41.88]];
    const box = el.querySelector('#trows');
    box.innerHTML = rows.map((r,i)=>`<div class="trow tn" id="tr${i}"><span class="s">${r[0]}</span><span class="p">${r[1].toFixed(2)}</span><span class="c up">+0.0%</span><span class="b">BUY</span></div>`).join('');
    const ch = rows.map(()=> (Math.random()*8-3));
    const tick = () => {
      const i = Math.floor(Math.random()*rows.length);
      ch[i] += (Math.random()-.5)*1.6; rows[i][1] *= 1+ch[i]/4000;
      const row = box.children[i];
      row.querySelector('.p').textContent = rows[i][1].toFixed(2);
      const c = row.querySelector('.c'); c.textContent = fmt(ch[i],1,'%').replace(MINUS,'-'); c.className = 'c ' + (ch[i]>=0?'up':'dn');
      row.querySelector('.b').textContent = ch[i]>=0 ? 'BUY' : 'SELL';
      row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
    };
    rows.forEach((_,i)=>{ const c = box.children[i].querySelector('.c'); c.textContent = fmt(ch[i],1,'%').replace(MINUS,'-'); c.className='c '+(ch[i]>=0?'up':'dn'); box.children[i].querySelector('.b').textContent = ch[i]>=0?'BUY':'SELL'; });
    if (!RM) ctx.every(520, tick);
    const P = walk(21,60,.718,.04), S = walk(3,60,.843,.03), all=P.concat(S), mn=Math.min(...all)-3, mx=Math.max(...all)+3;
    el.querySelector('#c2').innerHTML =
      `<line x1="0" x2="335" y1="91" y2="91" stroke="#1C1C1C"/>
       <path d="${pathOf(S,0,300,4,82,mn,mx)}" fill="none" stroke="#929292" stroke-dasharray="3 3" stroke-width="1.2"/>
       <path d="${pathOf(P,0,300,4,82,mn,mx)}" fill="none" stroke="#fff" stroke-width="1.6" pathLength="1" class="dl" data-d="1000"/>
       <text x="306" y="${yOf(S[60],4,82,mn,mx)+3}" fill="#929292" font-size="9.5" font-family="Inter">S&amp;P</text>
       <text x="306" y="${yOf(P[60],4,82,mn,mx)+3}" fill="#fff" font-size="9.5" font-family="Inter" class="fo" data-d="2400">You</text>`;
  },
  notes:{
    idea:'Puts both systems on one screen, framed by the two questions from the prototype: “What should I trade next?” and “What’s the best use of my capital?”. The top half is an anonymous trading app, the only place colour appears: flickering prices, red and green pills, BUY/SELL on every row, an alert badge. The bottom half is II: one slow line against the S&P and a count of decisions that each have a thesis. Dave’s two sentences frame the contrast above and below.',
    checks:['No competitor branding','Skip','Self-directed line','Colour used only on the trading-app side']
  }
});

/* 03 — Zoom out */
V.push({
  name:'Zoom out', tag:'The same holding from 1D to 10Y; the S&P appears once the horizon is long enough',
  html(){
    return `<div class="body" style="gap:14px">
      <h1 class="h1 fi" data-d="60">Different objective.<br>Different environment.</h1>
      <div class="seg fi" data-d="200" id="seg">${['1D','1W','1M','1Y','5Y','10Y'].map(r=>`<button aria-pressed="false" data-r="${r}">${r}</button>`).join('')}</div>
      <div class="fi" data-d="300" style="display:flex;justify-content:space-between;align-items:flex-end">
        <div><div class="lbl" id="z-l">Today</div><div class="big tn" id="z-n" style="margin-top:6px">+0.42%</div></div>
        <div style="text-align:right" id="z-r"><div class="lbl">S&amp;P 500</div><div class="tn" id="z-s" style="font-size:17px;font-weight:300;color:var(--t2);margin-top:6px">—</div></div>
      </div>
      <svg id="c3" width="335" height="200" viewBox="0 0 335 200" class="fi" data-d="300"></svg>
      <p class="cap fi" data-d="400" id="z-c"></p>
      ${SOURCES(500,['S&amp;P Dow Jones Indices','Illustrative holding'])}
    </div>${FOOT(600)}`;
  },
  init(el, ctx){
    const R = {
      '1D':{s:walk(11,120,.0042,.022), l:'Today', n:.42, cap:'The next move. This is the window trading apps are built around.'},
      '1W':{s:walk(12,120,-.013,.02), l:'This week', n:-1.3, cap:'Still mostly noise.'},
      '1M':{s:walk(13,120,.021,.018), l:'This month', n:2.1, cap:'Still mostly noise.'},
      '1Y':{s:walk(14,120,.094,.017), l:'1 year', n:9.4, sp:walk(24,120,.121,.012), spn:12.1, cap:'A pattern starts to form. So does the question: compared to what?'},
      '5Y':{s:walk(15,120,.612,.03), l:'5 years', n:61.2, sp:walk(18,120,.843,.022), spn:84.3, cap:'Now the alternative matters. A low-cost index fund was always one tap away.'},
      '10Y':{s:walk(16,120,2.146,.035), l:'10 years', n:214.6, sp:walk(17,120,2.012,.026), spn:201.2, cap:'Years, measured against the S&P 500. This is what compounding is made of.'}
    };
    const svg = el.querySelector('#c3'), W=335, H=184;
    svg.innerHTML = `<line x1="0" x2="${W}" y1="${H+8}" y2="${H+8}" stroke="#1C1C1C"/><path id="z-sp" fill="none" stroke="#929292" stroke-width="1.25" stroke-dasharray="3 3" opacity="0" style="transition:opacity .5s"/><path id="z-p" fill="none" stroke="#fff" stroke-width="1.6"/>`;
    const pP = svg.querySelector('#z-p'), pS = svg.querySelector('#z-sp');
    let curP = null, curS = null, anim = 0;
    const norm = (k) => { const r=R[k], all = r.sp? r.s.concat(r.sp) : r.s, mn=Math.min(...all), mx=Math.max(...all), pad=(mx-mn)*.08;
      const f = a => a.map(v => 4 + H*(1-(v-mn+pad)/(mx-mn+2*pad)));
      return [f(r.s), r.sp ? f(r.sp) : null]; };
    const toD = a => a.map((y,i)=>(i?'L':'M')+(W*i/(a.length-1)).toFixed(1)+','+y.toFixed(1)).join('');
    const set = (k) => {
      el.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.r===k));
      const r = R[k]; const [tp, ts] = norm(k);
      el.querySelector('#z-l').textContent = r.l;
      el.querySelector('#z-n').textContent = fmt(r.n, Math.abs(r.n)<10?2:1,'%');
      el.querySelector('#z-s').textContent = r.sp ? fmt(r.spn,1,'%') : '—';
      el.querySelector('#z-r').style.opacity = r.sp ? 1 : .35;
      const c = el.querySelector('#z-c'); c.style.opacity = 0; ctx.later(220, ()=>{ c.textContent = r.cap; c.style.opacity = 1; });
      pS.setAttribute('opacity', r.sp ? 1 : 0);
      if (ts) { if (!curS) curS = ts.slice(); }
      const fromP = curP || tp.map(()=>H/2+4), fromS = curS || (ts||[]).map(()=>H/2+4);
      const id = ++anim, t0 = performance.now(), dur = RM ? 0 : 1300;
      ctx.raf(function step(now){
        if (id !== anim) return false;
        const t = dur ? Math.min(1,(now-t0)/dur) : 1, e = ease(t);
        curP = fromP.map((y,i)=> y + (tp[i]-y)*e); pP.setAttribute('d', toD(curP));
        if (ts){ curS = fromS.map((y,i)=> y + (ts[i]-y)*e); pS.setAttribute('d', toD(curS)); }
        return t < 1;
      });
    };
    el.querySelectorAll('#seg button').forEach(b => b.addEventListener('click', ()=>{ ctx.stopAuto = true; set(b.dataset.r); }));
    const order = ['1D','1W','1M','1Y','5Y','10Y'];
    set('1D');
    if (RM) { set('10Y'); return; }
    order.slice(1).forEach((k,i)=> ctx.later(1500 + i*1600, ()=>{ if(!ctx.stopAuto) set(k); }));
  },
  notes:{
    idea:'One illustrative holding, auto-zooming from today to ten years. Every timeframe fills the chart, so 1D looks as dramatic as 10Y. Once the horizon is long enough the S&P 500 fades in as the alternative. The visitor feels the shift from noise to compounding before reading anything, and can tap the ranges to replay it.',
    checks:['Interactive','Attribution','Skip','Self-directed line']
  }
});

/* 04 — Systems, not goals */
V.push({
  name:'Systems, not goals', tag:'James Clear quote + an orbiting diagram of the system’s parts',
  html(){
    return `<div class="body" style="gap:8px">
      <blockquote class="quote fi" data-d="60" style="margin:0">“You don’t rise to the level of your goals. You fall to the level of your systems.”</blockquote>
      <div class="attr fi" data-d="250">James Clear, <i>Atomic Habits</i></div>
      <svg id="c4" class="orbit fi" data-d="450" width="335" height="320" viewBox="0 0 335 320"></svg>
      <p class="sub fi" data-d="900" style="text-align:center">The disciplines of serious capital allocation, built into everyday investing.</p>
    </div>${FOOT(1100)}`;
  },
  init(el, ctx){
    const svg = el.querySelector('#c4'), cx=167.5, cy=160, r=104;
    const N = ['Benchmarking','Investment case','Research','Calibration','Review','What would change my mind'];
    let g = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2A2D2E"/>
      <circle cx="${cx}" cy="${cy}" r="58" fill="none" stroke="#1C1C1C" stroke-dasharray="2 4"/>
      <text x="${cx}" y="${cy-2}" text-anchor="middle" fill="#fff" font-size="15" font-weight="400">Your capital</text>
      <text x="${cx}" y="${cy+16}" text-anchor="middle" fill="#929292" font-size="10.5">always vs S&amp;P 500</text>`;
    N.forEach((n,i)=>{
      const a = -Math.PI/2 + i*Math.PI*2/N.length, x = cx + r*Math.cos(a), y = cy + r*Math.sin(a);
      const lx = cx + (r+16)*Math.cos(a), ly = cy + (r+16)*Math.sin(a) + 4;
      const anchor = Math.abs(Math.cos(a))<.2 ? 'middle' : (Math.cos(a)>0?'start':'end');
      const dy = Math.abs(Math.cos(a))<.2 ? (Math.sin(a)<0?-6:10) : 0;
      g += `<g class="node" data-a="${a}"><circle cx="${x}" cy="${y}" r="5" fill="#565B5E"/><text x="${lx}" y="${ly+dy}" text-anchor="${anchor}" fill="#929292" font-size="12">${n}</text></g>`;
    });
    g += `<circle id="o-dot" r="3" fill="#fff"/>`;
    svg.innerHTML = g;
    const dot = svg.querySelector('#o-dot'), nodes = [...svg.querySelectorAll('.node')];
    let ang = -Math.PI/2; const t0 = performance.now();
    ctx.raf(now => {
      ang = -Math.PI/2 + ((now - t0)/1000) * (RM?0:0.3);
      dot.setAttribute('cx', cx + r*Math.cos(ang)); dot.setAttribute('cy', cy + r*Math.sin(ang));
      nodes.forEach(n => {
        let d = Math.abs(((ang - +n.dataset.a) % (2*Math.PI) + 3*Math.PI) % (2*Math.PI) - Math.PI);
        const on = d < .45 || RM;
        n.querySelector('circle').setAttribute('fill', on ? '#fff' : '#565B5E');
        n.querySelector('text').setAttribute('fill', on ? '#fff' : '#929292');
      });
      return true;
    });
  },
  notes:{
    idea:'Leads with Aidan’s James Clear line, then shows the system it refers to: a ring of the disciplines named in the prototype (benchmarking, investment case, research, Calibration, review, what would change my mind) circling the investor’s capital. A point of light moves around the ring and lights each part in turn. This follows Dave’s order: environment and system first, then features.',
    checks:['Quote attributed','Skip','Self-directed line','No data shown']
  }

      const t = RM ? 1e9 : now - t0, off = (t/1000)*7;
      c.clearRect(0,0,W,H);

      for (let i = 0; i < rows; i++){
        const p = Math.max(0, Math.min(1, (t - i*stag)/Math.max(1,sweep)));

/* ================= RUNTIME ================= */
const screen = document.getElementById('screen');
const list = document.getElementById('list');
const notes = document.getElementById('notes');
let idx = 0, ctx = null;

function makeCtx(){
  const c = {alive:true, ids:[], ivs:[], stopAuto:false};
  c.later = (ms, fn) => { const id = setTimeout(()=>{ if (c.alive) fn(); }, Math.max(0,ms*PACE)); c.ids.push(id); };
  c.every = (ms, fn) => { const id = setInterval(()=>{ if (c.alive) fn(); }, ms); c.ivs.push(id); };
  c.raf = (fn) => { const loop = (t) => { if (!c.alive) return; if (fn(t) !== false) requestAnimationFrame(loop); }; requestAnimationFrame(loop); };
  c.kill = () => { c.alive = false; c.ids.forEach(clearTimeout); c.ivs.forEach(clearInterval); };
  return c;
}

function countUp(el, c){
  const to = +el.dataset.count, suf = el.dataset.suf ?? '%', dec = +(el.dataset.dec ?? 1), t0 = performance.now();
  c.raf(now => { const t = RM?1:Math.min(1,(now-t0)/1800); el.textContent = fmt(to*ease(t), dec, suf); return t<1; });
}

let step = 0;
const FLOW_NAMES = () => [V[idx].name + ' (first page)'].concat(F.map(f => f.name));

function reveal(){
  screen.querySelectorAll('[data-d]').forEach(n => {
    const d = +n.dataset.d; if (d < 0) return;
    ctx.later(RM ? 0 : d, () => {
      n.classList.add('on');
      if (n.dataset.count !== undefined) countUp(n, ctx);
      n.querySelectorAll('[data-count]').forEach(x => countUp(x, ctx));
    });
  });
}

function mount(n, dir){
  if (ctx) ctx.kill();
  ctx = makeCtx();
  step = n;
  if (n === 0){
    const v = V[idx];
    screen.innerHTML = `<div class="scr${v.paper?' paper':''}${dir<0?' back-enter':''}">${SB}${NAV}${v.html()}</div>`;
    v.init(screen.firstElementChild, ctx);
  } else {
    const f = F[n-1];
    screen.innerHTML = `<div class="scr ${dir<0?'back-enter':'enter'}">${SB}${f.html()}</div>`;
    f.init && f.init(screen.firstElementChild, ctx);
  }
  reveal();
  paintNotes();
}

function paintNotes(){
  const v = V[idx], N = v.notes, names = FLOW_NAMES();
  const cur = step === 0 ? N.idea : F[step-1].note;
  notes.innerHTML = `
    <div><div class="eyebrow">Study ${String(idx+1).padStart(2,'0')}${step ? ' · Flow step ' + (step+1) + ' of ' + (F.length+1) : ''}</div><h2>${step ? F[step-1].name : v.name}</h2><p>${cur}</p></div>
    ${step === 0 ? `<div><div class="eyebrow" style="margin-bottom:8px">Constraints covered</div><div class="checks">${N.checks.map(c=>`<span>${c}</span>`).join('')}</div></div>` : ''}
    <div><div class="eyebrow" style="margin-bottom:8px">Sign-up flow · tap to jump</div><div class="flow">${names.map((nm,i)=>`<button data-step="${i}" aria-current="${i===step}"><span>${i+1}</span>${nm}</button>`).join('')}</div></div>
    <div class="disclaim">Every first-page study leads into the same six flow screens, rebuilt from the prototype in the II design system. All figures are illustrative placeholders for design review, not real index or portfolio returns.</div>`;
  notes.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => { const n = +b.dataset.step; mount(n, n < step ? -1 : 1); }));
}

function render(){
  mount(0, 0);
  list.querySelectorAll('.item').forEach((b,i)=> b.setAttribute('aria-current', i===idx));
  document.getElementById('count').textContent = String(idx+1).padStart(2,'0') + ' / ' + V.length;
  try { history.replaceState(null,'','#s'+(idx+1)); } catch(e){}
  try { localStorage.setItem('ii-signup-study', idx); } catch(e){}
}

screen.addEventListener('click', e => {
  const t = e.target.closest('[data-go]'); if (!t) return;
  const n = +t.dataset.go; mount(n, n < step ? -1 : 1);
});

V.forEach((v,i)=>{
  if (v.group && (i===0 || V[i-1].group !== v.group)){
    const h = document.createElement('div'); h.className = 'grp'; h.textContent = v.group; list.appendChild(h);
  }
  const b = document.createElement('button');
  b.className = 'item'; b.innerHTML = `<span class="n">${String(i+1).padStart(2,'0')}</span><span class="nm">${v.name}</span><span class="tg">${v.tag}</span>`;
  b.addEventListener('click', ()=>{ idx = i; render(); });
  list.appendChild(b);
});
const go = d => { idx = (idx + d + V.length) % V.length; render(); };
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('replay').onclick = () => mount(step, 0);
addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input,textarea')) return; if (e.key==='ArrowRight') go(1); if (e.key==='ArrowLeft') go(-1); });

/* fit the phone to the stage */
const devwrap = document.getElementById('devwrap'), device = document.getElementById('device'), stage = document.getElementById('stage');
function fit(){
  const narrow = innerWidth <= 1100;
  const availW = narrow ? Math.min(stage.clientWidth, 420) : stage.clientWidth - 24;
  const availH = narrow ? 828 : stage.clientHeight - 60;
  const s = Math.min(1, availW/391, availH/828);
  device.style.transform = `scale(${s})`;
  devwrap.style.width = (391*s)+'px'; devwrap.style.height = (828*s)+'px';
}
addEventListener('resize', fit);

const m = /^#s(\d+)$/.exec(location.hash);
if (m && +m[1]>=1 && +m[1]<=V.length) idx = +m[1]-1;
else { try { const s = +localStorage.getItem('ii-signup-study'); if (s>=0 && s<V.length) idx = s; } catch(e){} }
fit(); render();
if (document.fonts) document.fonts.ready.then(fit);
})();
</script>
